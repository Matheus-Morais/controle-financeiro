name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit de dependências
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes unitários
        run: pnpm test

      - name: Build de produção
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'placeholder-vapid-key' }}

  migrate:
    runs-on: ubuntu-latest
    # Roda apenas em PRs para a main, após o CI passar.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: ci
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar alterações nas migrations
        id: migrations
        run: |
          # No pull_request, o primeiro pai do merge é a base do PR.
          changed="$(git diff --name-only HEAD^1 HEAD -- supabase/migrations/)"
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.migrations.outputs.changed == 'true' && env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest

      # Pré-requisito: configure os 3 secrets no GitHub → Settings → Secrets → Actions:
      #   SUPABASE_ACCESS_TOKEN  → token pessoal (supabase.com/dashboard/account/tokens)
      #   SUPABASE_DB_PASSWORD   → senha do banco vinculado
      #   SUPABASE_PROJECT_ID    → ref do projeto vinculado
      # O `secrets` não pode ser usado em `if`; por isso o teste é feito
      # sobre a env var (mapeada no nível do job acima).
      - name: Validar migrations pendentes no Supabase
        if: steps.migrations.outputs.changed == 'true' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --remote --dry-run
