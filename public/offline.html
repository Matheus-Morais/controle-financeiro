<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Controle Financeiro</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.75rem; padding: 1.5rem;
        text-align: center; font-family: system-ui, sans-serif; background: #fff; color: #171717;
      }
      @media (prefers-color-scheme: dark) { body { background: #171717; color: #fafafa; } }
      h1 { font-size: 1.125rem; font-weight: 600; margin: 0; }
      p { max-width: 20rem; font-size: 0.875rem; color: #737373; margin: 0; }
      button {
        border: none; border-radius: 0.75rem; background: #16a34a; color: #fff;
        padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" width="64" height="64" />
    <h1>Você está sem conexão</h1>
    <p>
      Seus lançamentos ficam no servidor, então o aplicativo precisa de internet
      para mostrar os valores atualizados.
    </p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
